<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        .container {
            width: min(1100px, 94%);
            margin: 40px auto;
        }

        .card {
            background: #15151b;
            border: 1px solid #292933;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid #363642;
            background: #0d0d12;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #00c853;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .green {
            background: #00c853;
            color: white;
        }

        .green:hover {
            background: #00b84a;
        }

        .red {
            background: #e53935;
            color: white;
        }

        .red:hover {
            background: #d32f2f;
        }

        .gray {
            background: #292933;
            color: white;
        }

        .gray:hover {
            background: #353541;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #202028;
            color: #ddd;
        }

        .key-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .key-item {
            background: #0f0f14;
            border: 1px solid #292933;
            border-radius: 10px;
            padding: 16px;
        }

        .key-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .key-value {
            font-family: monospace;
            font-size: 16px;
            word-break: break-all;
        }

        .key-info {
            margin-top: 10px;
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .unused {
            background: #1d3b25;
            color: #65e889;
        }

        .used {
            background: #303b52;
            color: #8db4ff;
        }

        .revoked {
            background: #482020;
            color: #ff7777;
        }

        .expired {
            background: #443719;
            color: #ffc857;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .subtitle {
            color: #999;
            margin-top: -10px;
        }

        label {
            display: block;
            color: #ddd;
            font-size: 14px;
            font-weight: bold;
        }

        .duration-note {
            color: #888;
            font-size: 13px;
            margin-top: -6px;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginCard" class="card">
        <h1>Admin Login</h1>
        <p class="subtitle">Robux Demo Access Management</p>

        <label for="adminKey">Admin Key</label>
        <input
            id="adminKey"
            type="password"
            placeholder="Enter admin key"
        >

        <button class="green" onclick="login()">
            Login
        </button>

        <div id="loginMessage"></div>
    </div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="hidden">

        <div class="top-bar">
            <div>
                <h1>Access Key Manager</h1>
                <div class="subtitle">
                    Generate and manage demo website access keys.
                </div>
            </div>

            <button class="gray" onclick="logout()">
                Logout
            </button>
        </div>


        <!-- GENERATE -->
        <div class="card">

            <h2>Generate Access Key</h2>

            <label for="durationSelect">
                Access Duration
            </label>

            <select id="durationSelect">
                <option value="1h">1 Hour</option>
                <option value="6h">6 Hours</option>
                <option value="1d">1 Day</option>
                <option value="3d">3 Days</option>
                <option value="7d" selected>7 Days</option>
                <option value="30d">30 Days</option>
            </select>

            <div class="duration-note">
                The timer starts when the user redeems the key.
            </div>

            <button class="green" onclick="generateKey()">
                Generate Key
            </button>

            <div id="generateMessage"></div>

        </div>


        <!-- KEYS -->
        <div class="card">

            <div class="top-bar">
                <div>
                    <h2>Access Keys</h2>
                    <div class="subtitle">
                        Manage generated keys.
                    </div>
                </div>

                <button class="gray" onclick="loadKeys()">
                    Refresh
                </button>
            </div>

            <div id="keyList" class="key-list">
                Loading...
            </div>

        </div>

    </div>

</div>


<script>

async function api(action, extra = {}) {

    const response = await fetch("/api/keys", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        credentials: "include",
        body: JSON.stringify({
            action,
            ...extra
        })
    });

    let data;

    try {
        data = await response.json();
    } catch {
        data = {
            success: false,
            message: "Invalid server response."
        };
    }

    return {
        response,
        data
    };
}


function showMessage(elementId, message, success = false) {

    const element = document.getElementById(elementId);

    element.innerHTML = `
        <div class="message" style="
            color: ${success ? "#65e889" : "#ff7777"};
        ">
            ${escapeHtml(message)}
        </div>
    `;
}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDuration(duration) {

    const names = {
        "1h": "1 Hour",
        "6h": "6 Hours",
        "1d": "1 Day",
        "3d": "3 Days",
        "7d": "7 Days",
        "30d": "30 Days"
    };

    return names[duration] || duration || "Unknown";
}


function formatDate(date) {

    if (!date) {
        return "—";
    }

    const parsed = new Date(date);

    if (Number.isNaN(parsed.getTime())) {
        return "—";
    }

    return parsed.toLocaleString();
}


async function login() {

    const adminKey =
        document.getElementById("adminKey").value.trim();

    if (!adminKey) {

        showMessage(
            "loginMessage",
            "Please enter the admin key."
        );

        return;
    }

    const result = await api("login", {
        adminKey
    });

    if (!result.data.success) {

        showMessage(
            "loginMessage",
            result.data.message || "Login failed."
        );

        return;
    }

    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");

    document.getElementById("adminKey").value = "";

    loadKeys();
}


async function logout() {

    await api("logout");

    document.getElementById("adminPanel").classList.add("hidden");
    document.getElementById("loginCard").classList.remove("hidden");

    document.getElementById("keyList").innerHTML = "";
}


async function generateKey() {

    const duration =
        document.getElementById("durationSelect").value;

    const result = await api("generate", {
        duration
    });

    if (!result.data.success) {

        showMessage(
            "generateMessage",
            result.data.message || "Failed to generate key."
        );

        return;
    }

    showMessage(
        "generateMessage",
        `Key generated: ${result.data.key}`,
        true
    );

    loadKeys();
}


async function loadKeys() {

    const list = document.getElementById("keyList");

    list.innerHTML = "Loading...";

    const result = await api("list");

    if (!result.data.success) {

        list.innerHTML = `
            <div class="message" style="color:#ff7777;">
                ${escapeHtml(
                    result.data.message || "Failed to load keys."
                )}
            </div>
        `;

        return;
    }

    const keys = result.data.keys || [];

    if (keys.length === 0) {

        list.innerHTML = `
            <div class="message">
                No access keys yet.
            </div>
        `;

        return;
    }

    list.innerHTML = keys.map((item) => {

        const isExpired =
            item.status === "used" &&
            item.expiresAt &&
            new Date(item.expiresAt).getTime() <= Date.now();

        let statusClass = item.status;
        let statusText = item.status.toUpperCase();

        if (isExpired) {
            statusClass = "expired";
            statusText = "EXPIRED";
        }

        let expirationText;

        if (item.status === "revoked") {

            expirationText = "Revoked";

        } else if (isExpired) {

            expirationText = `Expired: ${formatDate(item.expiresAt)}`;

        } else if (item.status === "used") {

            expirationText = `Expires: ${formatDate(item.expiresAt)}`;

        } else {

            expirationText = "Starts when redeemed";
        }

        return `
            <div class="key-item">

                <div class="key-top">

                    <div class="key-value">
                        ${escapeHtml(item.key)}
                    </div>

                    <span class="badge ${statusClass}">
                        ${escapeHtml(statusText)}
                    </span>

                </div>

                <div class="key-info">

                    <div>
                        <strong>Duration:</strong>
                        ${escapeHtml(
                            formatDuration(item.duration)
                        )}
                    </div>

                    <div>
                        <strong>Created:</strong>
                        ${escapeHtml(
                            formatDate(item.createdAt)
                        )}
                    </div>

                    <div>
                        <strong>Used:</strong>
                        ${escapeHtml(
                            formatDate(item.usedAt)
                        )}
                    </div>

                    <div>
                        <strong>Access:</strong>
                        ${escapeHtml(expirationText)}
                    </div>

                    ${
                        item.revokedAt
                            ? `
                                <div>
                                    <strong>Revoked:</strong>
                                    ${escapeHtml(
                                        formatDate(item.revokedAt)
                                    )}
                                </div>
                            `
                            : ""
                    }

                </div>

                <div class="actions">

                    <button
                        class="gray"
                        onclick="copyKey('${escapeHtml(item.key)}')"
                    >
                        Copy Key
                    </button>

                    ${
                        item.status === "unused"
                            ? `
                                <button
                                    class="red"
                                    onclick="revokeKey('${escapeHtml(item.key)}')"
                                >
                                    Revoke
                                </button>
                            `
                            : ""
                    }

                </div>

            </div>
        `;

    }).join("");
}


async function revokeKey(key) {

    const confirmed = confirm(
        "Are you sure you want to revoke this key?"
    );

    if (!confirmed) {
        return;
    }

    const result = await api("revoke", {
        key
    });

    if (!result.data.success) {

        alert(
            result.data.message ||
            "Failed to revoke key."
        );

        return;
    }

    loadKeys();
}


async function copyKey(key) {

    try {

        await navigator.clipboard.writeText(key);

        alert("Key copied!");

    } catch {

        prompt(
            "Copy this access key:",
            key
        );
    }
}


/*
    Automatically check whether the admin
    session is already active when opening
    the admin page.
*/
async function checkLogin() {

    const result = await api("list");

    if (result.data.success) {

        document.getElementById("loginCard")
            .classList.add("hidden");

        document.getElementById("adminPanel")
            .classList.remove("hidden");

        loadKeys();
    }
}


checkLogin();

</script>

</body>
</html>
