<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Access Key Manager</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#f2f3f5;font-family:Arial,Helvetica,sans-serif;padding:30px}.wrap{max-width:760px;margin:0 auto}.card{background:#15181e;border:1px solid #30343d;border-radius:14px;padding:22px;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:24px;font-weight:900}.muted{color:#9298a3;font-size:12px}.row{display:flex;gap:10px;margin-top:18px}input{flex:1;height:44px;background:#20242b;border:1px solid #3a3f49;border-radius:8px;color:#fff;padding:0 12px}button{height:44px;border:0;border-radius:8px;background:#3d6cff;color:#fff;font-weight:800;padding:0 18px;cursor:pointer}button.secondary{background:#2b3038}.key{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #292d35}.key:last-child{border-bottom:0}.keycode{font-family:monospace;font-size:14px;word-break:break-all}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px;background:#29322b;color:#8be28e}.badge.used{background:#332b2b;color:#ff9d9d}.status{min-height:20px;margin-top:12px;font-size:12px;color:#9aa0aa}.hidden{display:none}.login h1{font-size:21px;margin:0 0 8px}.empty{color:#7f858f;font-size:13px;padding:16px 0}@media(max-width:600px){body{padding:15px}.row{flex-direction:column}.key{align-items:flex-start;flex-direction:column}.key button{width:100%}}</style></head><body><main class="wrap"><div class="card login" id="loginCard"><div class="logo">🔑 Access Key Manager</div><p class="muted">Admin only. Generate one-time keys for your visitors.</p><div class="row"><input id="adminKey" type="password" placeholder="Admin key"><button id="loginBtn">Login</button></div><div class="status" id="loginStatus"></div></div><div class="card hidden" id="panel"><div class="head"><div><div class="logo">Access Keys</div><div class="muted">Every generated key can be redeemed once.</div></div><button id="generateBtn">Generate Key</button></div><div class="status" id="panelStatus"></div><div id="keys" style="margin-top:12px"></div></div></main><script>
const loginCard=document.getElementById('loginCard'),panel=document.getElementById('panel'),adminKey=document.getElementById('adminKey'),loginBtn=document.getElementById('loginBtn'),loginStatus=document.getElementById('loginStatus'),generateBtn=document.getElementById('generateBtn'),panelStatus=document.getElementById('panelStatus'),keysEl=document.getElementById('keys');
async function api(action,extra={}){const r=await fetch('/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
loginBtn.onclick=async()=>{loginStatus.textContent='Checking...';try{await api('login',{key:adminKey.value.trim()});loginCard.classList.add('hidden');panel.classList.remove('hidden');loadKeys()}catch(e){loginStatus.textContent=e.message}};
adminKey.onkeydown=e=>{if(e.key==='Enter')loginBtn.click()};
generateBtn.onclick=async()=>{generateBtn.disabled=true;panelStatus.textContent='Generating...';try{const d=await api('generate');panelStatus.textContent='New key: '+d.key+' — copy it and give it to one person.';await loadKeys()}catch(e){panelStatus.textContent=e.message}generateBtn.disabled=false};
async function loadKeys(){try{const d=await api('list');keysEl.innerHTML='';if(!d.keys.length){keysEl.innerHTML='<div class="empty">No keys generated yet.</div>';return}d.keys.forEach(k=>{const row=document.createElement('div');row.className='key';const left=document.createElement('div');left.innerHTML='<div class="keycode"></div><div class="muted">'+(k.createdAt?new Date(k.createdAt).toLocaleString():'')+'</div>';left.querySelector('.keycode').textContent=k.key;const right=document.createElement('div');right.style.display='flex';right.style.gap='8px';const badge=document.createElement('span');badge.className='badge '+(k.status==='used'?'used':'');badge.textContent=k.status.toUpperCase();const copy=document.createElement('button');copy.className='secondary';copy.textContent='Copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(k.key);copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy',1200)}catch{prompt('Copy this key:',k.key)}};right.append(badge,copy);row.append(left,right);keysEl.append(row)})}catch(e){panelStatus.textContent=e.message;if(e.message.includes('authentication')){panel.classList.add('hidden');loginCard.classList.remove('hidden')}}}
</script></body></html>
