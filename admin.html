<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<meta
    name="robots"
    content="noindex,nofollow"
>

<title>Access Key Manager</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0c0f;
    color: #f2f3f5;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    padding: 30px;
}

.wrap {
    max-width: 760px;
    margin: 0 auto;
}

.card {
    background: #15181e;
    border: 1px solid #30343d;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 16px;
}

.head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.logo {
    font-size: 24px;
    font-weight: 900;
}

.muted {
    color: #9298a3;
    font-size: 12px;
}

.row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

input {
    flex: 1;
    height: 44px;
    background: #20242b;
    border: 1px solid #3a3f49;
    border-radius: 8px;
    color: #fff;
    padding: 0 12px;
}

button {
    height: 44px;
    border: 0;
    border-radius: 8px;
    background: #3d6cff;
    color: #fff;
    font-weight: 800;
    padding: 0 18px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

button.secondary {
    background: #2b3038;
}

button.revoke {
    background: #b83232;
}

button.revoke:hover {
    background: #d13c3c;
}

.key {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #292d35;
}

.key:last-child {
    border-bottom: 0;
}

.keycode {
    font-family: monospace;
    font-size: 14px;
    word-break: break-all;
}

.badge {
    font-size: 10px;
    font-weight: 800;
    padding: 5px 8px;
    border-radius: 20px;
    background: #29322b;
    color: #8be28e;
}

.badge.used {
    background: #332b2b;
    color: #ff9d9d;
}

.badge.revoked {
    background: #332d25;
    color: #ffbd75;
}

.status {
    min-height: 20px;
    margin-top: 12px;
    font-size: 12px;
    color: #9aa0aa;
}

.hidden {
    display: none;
}

.login h1 {
    font-size: 21px;
    margin: 0 0 8px;
}

.empty {
    color: #7f858f;
    font-size: 13px;
    padding: 16px 0;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

@media(max-width:600px) {

    body {
        padding: 15px;
    }

    .row {
        flex-direction: column;
    }

    .key {
        align-items: flex-start;
        flex-direction: column;
    }

    .actions {
        width: 100%;
    }

    .actions button {
        flex: 1;
    }

    .key button {
        min-width: 80px;
    }

}

</style>

</head>


<body>

<main class="wrap">


<!-- LOGIN -->

<div
    class="card login"
    id="loginCard"
>

    <div class="logo">
        🔑 Access Key Manager
    </div>

    <p class="muted">
        Admin only. Generate one-time keys for your visitors.
    </p>

    <div class="row">

        <input
            id="adminKey"
            type="password"
            placeholder="Admin key"
        >

        <button id="loginBtn">
            Login
        </button>

    </div>

    <div
        class="status"
        id="loginStatus"
    ></div>

</div>


<!-- ADMIN PANEL -->

<div
    class="card hidden"
    id="panel"
>

    <div class="head">

        <div>

            <div class="logo">
                Access Keys
            </div>

            <div class="muted">
                Every generated key can be redeemed once.
            </div>

        </div>

        <button
            id="generateBtn"
        >
            Generate Key
        </button>

    </div>


    <div
        class="status"
        id="panelStatus"
    ></div>


    <div
        id="keys"
        style="margin-top:12px"
    ></div>

</div>


</main>


<script>


/*
 * ---------------------------------------------------------
 * Elements
 * ---------------------------------------------------------
 */

const loginCard =
    document.getElementById(
        "loginCard"
    );

const panel =
    document.getElementById(
        "panel"
    );

const adminKey =
    document.getElementById(
        "adminKey"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const loginStatus =
    document.getElementById(
        "loginStatus"
    );

const generateBtn =
    document.getElementById(
        "generateBtn"
    );

const panelStatus =
    document.getElementById(
        "panelStatus"
    );

const keysEl =
    document.getElementById(
        "keys"
    );


/*
 * ---------------------------------------------------------
 * API helper
 * ---------------------------------------------------------
 */

async function api(
    action,
    extra = {}
) {

    const response =
        await fetch(
            "/api/keys",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                credentials:
                    "same-origin",

                body:
                    JSON.stringify({
                        action,
                        ...extra
                    })
            }
        );


    const data =
        await response
            .json()
            .catch(
                () => ({})
            );


    if (
        !response.ok
    ) {

        throw new Error(
            data.error ||
            "Request failed"
        );
    }


    return data;
}


/*
 * ---------------------------------------------------------
 * LOGIN
 * ---------------------------------------------------------
 */

loginBtn.onclick =
    async () => {

        loginStatus.textContent =
            "Checking...";


        try {

            await api(
                "login",
                {
                    key:
                        adminKey.value.trim()
                }
            );


            loginCard
                .classList
                .add("hidden");


            panel
                .classList
                .remove("hidden");


            await loadKeys();


        } catch (error) {

            loginStatus.textContent =
                error.message;
        }

    };


adminKey.onkeydown =
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            loginBtn.click();
        }

    };


/*
 * ---------------------------------------------------------
 * GENERATE KEY
 * ---------------------------------------------------------
 */

generateBtn.onclick =
    async () => {

        generateBtn.disabled =
            true;


        panelStatus.textContent =
            "Generating...";


        try {

            const data =
                await api(
                    "generate"
                );


            panelStatus.textContent =
                "New key: " +
                data.key +
                " — copy it and give it to one person.";


            await loadKeys();


        } catch (error) {

            panelStatus.textContent =
                error.message;

        }


        generateBtn.disabled =
            false;
    };


/*
 * ---------------------------------------------------------
 * REVOKE KEY
 * ---------------------------------------------------------
 */

async function revokeKey(
    key,
    button
) {

    const confirmed =
        confirm(
            "Revoke this key?\n\n" +
            key +
            "\n\n" +
            "This will prevent the key from being used again."
        );


    if (!confirmed) {
        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Revoking...";


    try {

        await api(
            "revoke",
            {
                key
            }
        );


        panelStatus.textContent =
            "Key revoked: " +
            key;


        await loadKeys();


    } catch (error) {

        panelStatus.textContent =
            error.message;


        button.disabled =
            false;

        button.textContent =
            "Revoke";
    }

}


/*
 * ---------------------------------------------------------
 * LOAD KEYS
 * ---------------------------------------------------------
 */

async function loadKeys() {

    try {

        const data =
            await api(
                "list"
            );


        keysEl.innerHTML =
            "";


        if (
            !data.keys ||
            !data.keys.length
        ) {

            keysEl.innerHTML =
                '<div class="empty">' +
                'No keys generated yet.' +
                '</div>';

            return;
        }


        data.keys.forEach(
            keyData => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "key";


                /*
                 * LEFT SIDE
                 */

                const left =
                    document.createElement(
                        "div"
                    );


                const keyCode =
                    document.createElement(
                        "div"
                    );


                keyCode.className =
                    "keycode";


                keyCode.textContent =
                    keyData.key;


                const date =
                    document.createElement(
                        "div"
                    );


                date.className =
                    "muted";


                date.textContent =
                    keyData.createdAt
                        ? new Date(
                            keyData.createdAt
                        ).toLocaleString()
                        : "";


                left.append(
                    keyCode,
                    date
                );


                /*
                 * RIGHT SIDE
                 */

                const right =
                    document.createElement(
                        "div"
                    );


                right.className =
                    "actions";


                /*
                 * STATUS BADGE
                 */

                const badge =
                    document.createElement(
                        "span"
                    );


                badge.className =
                    "badge";


                if (
                    keyData.status ===
                    "used"
                ) {

                    badge.classList
                        .add("used");

                }


                if (
                    keyData.status ===
                    "revoked"
                ) {

                    badge.classList
                        .add("revoked");

                }


                badge.textContent =
                    String(
                        keyData.status ||
                        "unused"
                    ).toUpperCase();


                /*
                 * COPY BUTTON
                 */

                const copy =
                    document.createElement(
                        "button"
                    );


                copy.className =
                    "secondary";


                copy.textContent =
                    "Copy";


                copy.onclick =
                    async () => {

                        try {

                            await navigator
                                .clipboard
                                .writeText(
                                    keyData.key
                                );


                            copy.textContent =
                                "Copied";


                            setTimeout(
                                () => {

                                    copy.textContent =
                                        "Copy";

                                },
                                1200
                            );


                        } catch {

                            prompt(
                                "Copy this key:",
                                keyData.key
                            );

                        }

                    };


                right.append(
                    badge,
                    copy
                );


                /*
                 * REVOKE BUTTON
                 *
                 * Don't show it if
                 * already revoked.
                 */

                if (
                    keyData.status !==
                    "revoked"
                ) {

                    const revoke =
                        document.createElement(
                            "button"
                        );


                    revoke.className =
                        "revoke";


                    revoke.textContent =
                        "Revoke";


                    revoke.onclick =
                        () =>
                            revokeKey(
                                keyData.key,
                                revoke
                            );


                    right.append(
                        revoke
                    );
                }


                row.append(
                    left,
                    right
                );


                keysEl.append(
                    row
                );

            }
        );


    } catch (error) {

        panelStatus.textContent =
            error.message;


        if (
            error.message
                .toLowerCase()
                .includes(
                    "authentication"
                )
        ) {

            panel
                .classList
                .add("hidden");


            loginCard
                .classList
                .remove("hidden");
        }

    }

}


</script>

</body>

</html>
