<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>Access Key Manager</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0c0f;
    color:#f2f3f5;
    font-family:Arial,Helvetica,sans-serif;
    padding:30px;
}

.wrap{
    max-width:800px;
    margin:auto;
}

.card{
    background:#15181e;
    border:1px solid #30343d;
    border-radius:14px;
    padding:22px;
    margin-bottom:16px;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.muted{
    color:#9298a3;
    font-size:12px;
}

.row{
    display:flex;
    gap:10px;
    margin-top:18px;
}

input,
select{
    height:44px;
    background:#20242b;
    border:1px solid #3a3f49;
    border-radius:8px;
    color:#fff;
    padding:0 12px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#3d6cff;
}

input{
    flex:1;
}

button{
    height:44px;
    border:0;
    border-radius:8px;
    background:#3d6cff;
    color:#fff;
    font-weight:800;
    padding:0 16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.secondary{
    background:#2b3038;
}

.revoke{
    background:#57352c;
}

.remove{
    background:#47262b;
}

.duration-box{
    margin-top:18px;
    padding:16px;
    background:#101217;
    border:1px solid #292d35;
    border-radius:10px;
}

.duration-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:9px;
}

.duration-row{
    display:flex;
    gap:10px;
}

.duration-row input{
    width:150px;
    flex:none;
}

.duration-row select{
    flex:1;
}

.duration-note{
    margin-top:9px;
    color:#7f8794;
    font-size:11px;
}

.status{
    min-height:20px;
    margin-top:12px;
    font-size:12px;
}

.success{
    color:#8be28e;
}

.error{
    color:#ff9d9d;
}

.hidden{
    display:none;
}

.keys-title{
    margin-top:28px;
    font-size:18px;
    font-weight:900;
}

.empty{
    color:#7f858f;
    font-size:13px;
    padding:16px 0;
}

.key{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:16px 0;
    border-bottom:1px solid #292d35;
}

.key:last-child{
    border-bottom:0;
}

.key-left{
    min-width:0;
    flex:1;
}

.keycode{
    font-family:monospace;
    font-size:14px;
    word-break:break-all;
}

.key-info{
    margin-top:7px;
    color:#8f96a2;
    font-size:11px;
    line-height:1.6;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    background:#29322b;
    color:#8be28e;
    font-size:10px;
    font-weight:900;
    white-space:nowrap;
}

.badge.used{
    background:#332b2b;
    color:#ff9d9d;
}

.badge.revoked{
    background:#302d24;
    color:#ffd36b;
}

.badge.expired{
    background:#332b2b;
    color:#ff7777;
}

.key-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:7px;
    flex-wrap:wrap;
    max-width:280px;
}

@media(max-width:650px){

    body{
        padding:15px;
    }

    .row{
        flex-direction:column;
    }

    .duration-row{
        flex-direction:column;
    }

    .duration-row input{
        width:100%;
    }

    .key{
        flex-direction:column;
    }

    .key-actions{
        max-width:none;
        width:100%;
        justify-content:flex-start;
    }

    .key-actions button{
        flex:1;
    }
}
</style>
</head>

<body>

<main class="wrap">

    <!-- LOGIN -->

    <div class="card" id="loginCard">

        <div class="logo">
            🔑 Access Key Manager
        </div>

        <p class="muted">
            Admin only. Create and manage access keys.
        </p>

        <div class="row">

            <input
                id="adminKey"
                type="password"
                placeholder="Admin key"
            >

            <button id="loginBtn">
                Login
            </button>

        </div>

        <div
            id="loginStatus"
            class="status"
        ></div>

    </div>


    <!-- ADMIN PANEL -->

    <div
        class="card hidden"
        id="panel"
    >

        <div class="logo">
            Access Key Manager
        </div>

        <div class="muted">
            Create custom-duration access keys.
        </div>


        <!-- DURATION -->

        <div class="duration-box">

            <div class="duration-title">
                ⏱ Access Duration
            </div>

            <div class="duration-row">

                <input
                    id="durationValue"
                    type="number"
                    min="1"
                    step="1"
                    value="1"
                >

                <select id="durationUnit">

                    <option value="minutes">
                        Minutes
                    </option>

                    <option value="hours" selected>
                        Hours
                    </option>

                    <option value="days">
                        Days
                    </option>

                    <option value="weeks">
                        Weeks
                    </option>

                </select>

            </div>

            <div class="duration-note">
                The timer starts when the key is redeemed.
                Maximum duration is 365 days.
            </div>

        </div>


        <div class="row">

            <button id="generateBtn">
                Generate Key
            </button>

        </div>


        <div
            id="panelStatus"
            class="status"
        ></div>


        <!-- KEY LIST -->

        <div class="keys-title">
            Access Keys
        </div>

        <div id="keys"></div>

    </div>

</main>


<script>

const loginCard =
    document.getElementById("loginCard");

const panel =
    document.getElementById("panel");

const adminKey =
    document.getElementById("adminKey");

const loginBtn =
    document.getElementById("loginBtn");

const loginStatus =
    document.getElementById("loginStatus");

const durationValue =
    document.getElementById("durationValue");

const durationUnit =
    document.getElementById("durationUnit");

const generateBtn =
    document.getElementById("generateBtn");

const panelStatus =
    document.getElementById("panelStatus");

const keysEl =
    document.getElementById("keys");


/* API */

async function api(
    action,
    extra = {}
){

    const response =
        await fetch(
            "/api/keys",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                credentials:"same-origin",

                body:
                    JSON.stringify({
                        action,
                        ...extra
                    })
            }
        );


    const data =
        await response
            .json()
            .catch(
                () => ({})
            );


    if(!response.ok){

        throw new Error(
            data.error ||
            data.message ||
            "Request failed."
        );

    }


    return data;

}


/* LOGIN */

loginBtn.onclick =
async () => {

    loginStatus.textContent =
        "Checking...";

    loginStatus.className =
        "status";


    try{

        const data =
            await api(
                "login",
                {
                    key:
                        adminKey.value.trim()
                }
            );


        if(!data.success){

            throw new Error(
                data.error ||
                "Login failed."
            );

        }


        loginCard
            .classList
            .add("hidden");


        panel
            .classList
            .remove("hidden");


        await loadKeys();


    }catch(error){

        loginStatus.textContent =
            error.message;

        loginStatus.className =
            "status error";

    }

};


adminKey.onkeydown =
event => {

    if(
        event.key ===
        "Enter"
    ){

        loginBtn.click();

    }

};


/* GENERATE */

generateBtn.onclick =
async () => {

    const value =
        Number(
            durationValue.value
        );


    const unit =
        durationUnit.value;


    if(
        !Number.isFinite(value) ||
        value <= 0
    ){

        panelStatus.textContent =
            "Enter a valid duration.";

        panelStatus.className =
            "status error";

        return;

    }


    generateBtn.disabled =
        true;


    panelStatus.textContent =
        "Generating...";

    panelStatus.className =
        "status";


    try{

        const data =
            await api(
                "generate",
                {
                    durationValue:
                        value,

                    durationUnit:
                        unit
                }
            );


        panelStatus.textContent =
            "Key generated: " +
            data.key +
            " — " +
            formatDuration(
                data.durationValue,
                data.durationUnit
            ) +
            ". Timer starts when redeemed.";

        panelStatus.className =
            "status success";


        await loadKeys();


    }catch(error){

        panelStatus.textContent =
            error.message;

        panelStatus.className =
            "status error";

    }


    generateBtn.disabled =
        false;

};


/* DURATION TEXT */

function formatDuration(
    value,
    unit
){

    if(
        value === null ||
        value === undefined
    ){

        return "Legacy duration";

    }


    const number =
        Number(value);


    const names = {

        minutes:
            number === 1
                ? "minute"
                : "minutes",

        hours:
            number === 1
                ? "hour"
                : "hours",

        days:
            number === 1
                ? "day"
                : "days",

        weeks:
            number === 1
                ? "week"
                : "weeks"

    };


    return (
        number +
        " " +
        (
            names[unit] ||
            unit
        )
    );

}


/* STATUS */

function getStatus(key){

    if(
        key.status ===
        "revoked"
    ){

        return {
            text:"REVOKED",
            className:"revoked"
        };

    }


    if(
        key.expiresAt &&
        Date.now() >=
        Number(key.expiresAt)
    ){

        return {
            text:"EXPIRED",
            className:"expired"
        };

    }


    if(
        key.status ===
        "used"
    ){

        return {
            text:"USED",
            className:"used"
        };

    }


    return {
        text:"UNUSED",
        className:""
    };

}


/* LOAD KEYS */

async function loadKeys(){

    try{

        const data =
            await api("list");


        if(
            !data.success
        ){

            throw new Error(
                data.error ||
                "Failed to load keys."
            );

        }


        keysEl.innerHTML =
            "";


        if(
            !data.keys ||
            data.keys.length === 0
        ){

            keysEl.innerHTML =
                '<div class="empty">' +
                'No access keys yet.' +
                '</div>';

            return;

        }


        data.keys.forEach(
            key => {

                renderKey(key);

            }
        );


    }catch(error){

        keysEl.innerHTML =
            '<div class="empty">' +
            'Failed to load keys: ' +
            escapeHtml(
                error.message
            ) +
            '</div>';

    }

}


/* RENDER KEY */

function renderKey(key){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "key";


    /* LEFT */

    const left =
        document.createElement(
            "div"
        );

    left.className =
        "key-left";


    const code =
        document.createElement(
            "div"
        );

    code.className =
        "keycode";

    code.textContent =
        key.key;


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "key-info";


    let text =
        formatDuration(
            key.durationValue,
            key.durationUnit
        );


    if(
        key.status ===
        "unused"
    ){

        text +=
            " • Starts when redeemed";

    }


    if(key.createdAt){

        text +=
            " • Created " +
            new Date(
                key.createdAt
            ).toLocaleString();

    }


    if(key.usedAt){

        text +=
            " • Redeemed " +
            new Date(
                key.usedAt
            ).toLocaleString();

    }


    if(key.expiresAt){

        text +=
            " • Expires " +
            new Date(
                Number(
                    key.expiresAt
                )
            ).toLocaleString();

    }


    info.textContent =
        text;


    left.append(
        code,
        info
    );


    /* ACTIONS */

    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "key-actions";


    const status =
        getStatus(key);


    const badge =
        document.createElement(
            "span"
        );

    badge.className =
        "badge " +
        status.className;

    badge.textContent =
        status.text;


    actions.append(
        badge
    );


    /* COPY */

    const copy =
        document.createElement(
            "button"
        );

    copy.className =
        "secondary";

    copy.textContent =
        "Copy";


    copy.onclick =
    async () => {

        try{

            await navigator
                .clipboard
                .writeText(
                    key.key
                );


            copy.textContent =
                "Copied";


            setTimeout(
                () => {

                    copy.textContent =
                        "Copy";

                },
                1200
            );


        }catch{

            prompt(
                "Copy this key:",
                key.key
            );

        }

    };


    actions.append(
        copy
    );


    /*
     * REVOKE
     *
     * Available for unused keys.
     */

    if(
        key.status !==
        "revoked" &&
        key.status !==
        "used"
    ){

        const revoke =
            document.createElement(
                "button"
            );

        revoke.className =
            "revoke";

        revoke.textContent =
            "Revoke";


        revoke.onclick =
        async () => {

            const confirmed =
                confirm(
                    "Revoke this access key?\n\n" +
                    key.key
                );


            if(!confirmed){

                return;

            }


            revoke.disabled =
                true;


            try{

                await api(
                    "revoke",
                    {
                        key:
                            key.key
                    }
                );


                await loadKeys();


            }catch(error){

                panelStatus.textContent =
                    error.message;

                panelStatus.className =
                    "status error";


                revoke.disabled =
                    false;

            }

        };


        actions.append(
            revoke
        );

    }


    /*
     * REMOVE
     *
     * Only expired or revoked keys.
     */

    const expired =
        key.expiresAt &&
        Date.now() >=
        Number(
            key.expiresAt
        );


    const revoked =
        key.status ===
        "revoked";


    if(
        expired ||
        revoked
    ){

        const remove =
            document.createElement(
                "button"
            );

        remove.className =
            "remove";

        remove.textContent =
            "Remove";


        remove.onclick =
        async () => {

            const confirmed =
                confirm(
                    "Permanently remove this key?\n\n" +
                    key.key +
                    "\n\n" +
                    "This cannot be undone."
                );


            if(!confirmed){

                return;

            }


            remove.disabled =
                true;


            try{

                await api(
                    "remove",
                    {
                        key:
                            key.key
                    }
                );


                await loadKeys();


            }catch(error){

                panelStatus.textContent =
                    error.message;

                panelStatus.className =
                    "status error";


                remove.disabled =
                    false;

            }

        };


        actions.append(
            remove
        );

    }


    row.append(
        left,
        actions
    );


    keysEl.append(
        row
    );

}


/* HTML ESCAPE */

function escapeHtml(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/*
 * Refresh status automatically.
 *
 * This makes an UNUSED/USED key
 * change to EXPIRED without
 * refreshing the whole page.
 */

setInterval(
    () => {

        if(
            !panel.classList.contains(
                "hidden"
            )
        ){

            loadKeys();

        }

    },
    30000
);

</script>

</body>
</html>
