<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Access Key Manager</title>

<style>
*{
    box-sizing:border-box
}

body{
    margin:0;
    background:#0b0c0f;
    color:#f2f3f5;
    font-family:Arial,Helvetica,sans-serif;
    padding:30px
}

.wrap{
    max-width:760px;
    margin:0 auto
}

.card{
    background:#15181e;
    border:1px solid #30343d;
    border-radius:14px;
    padding:22px;
    margin-bottom:16px
}

.head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px
}

.logo{
    font-size:24px;
    font-weight:900
}

.muted{
    color:#9298a3;
    font-size:12px
}

.row{
    display:flex;
    gap:10px;
    margin-top:18px
}

input,
select{
    height:44px;
    background:#20242b;
    border:1px solid #3a3f49;
    border-radius:8px;
    color:#fff;
    padding:0 12px;
    outline:none
}

input:focus,
select:focus{
    border-color:#3d6cff
}

input{
    flex:1
}

button{
    height:44px;
    border:0;
    border-radius:8px;
    background:#3d6cff;
    color:#fff;
    font-weight:800;
    padding:0 18px;
    cursor:pointer
}

button:hover{
    opacity:.9
}

button:disabled{
    opacity:.5;
    cursor:not-allowed
}

button.secondary{
    background:#2b3038
}

.duration-box{
    margin-top:18px;
    padding:16px;
    background:#101217;
    border:1px solid #292d35;
    border-radius:10px
}

.duration-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:8px
}

.duration-row{
    display:flex;
    gap:10px
}

.duration-row input{
    width:150px;
    flex:none
}

.duration-row select{
    flex:1;
    cursor:pointer
}

.duration-note{
    margin-top:9px;
    color:#7f8794;
    font-size:11px
}

.status{
    min-height:20px;
    margin-top:12px;
    font-size:12px;
    color:#9aa0aa
}

.success{
    color:#8be28e
}

.error{
    color:#ff9d9d
}

.hidden{
    display:none
}

.login h1{
    font-size:21px;
    margin:0 0 8px
}

.empty{
    color:#7f858f;
    font-size:13px;
    padding:16px 0
}

.key{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #292d35
}

.key:last-child{
    border-bottom:0
}

.keycode{
    font-family:monospace;
    font-size:14px;
    word-break:break-all
}

.key-info{
    margin-top:5px;
    line-height:1.6
}

.badge{
    display:inline-block;
    font-size:10px;
    font-weight:800;
    padding:5px 8px;
    border-radius:20px;
    background:#29322b;
    color:#8be28e
}

.badge.used{
    background:#332b2b;
    color:#ff9d9d
}

.badge.revoked{
    background:#302d24;
    color:#ffd36b
}

.badge.expired{
    background:#332b2b;
    color:#ff9d9d
}

.key-buttons{
    display:flex;
    gap:8px;
    align-items:center;
    flex-shrink:0
}

.revoke{
    background:#442b2b
}

@media(max-width:600px){

    body{
        padding:15px
    }

    .row{
        flex-direction:column
    }

    .head{
        flex-direction:column;
        align-items:flex-start
    }

    .head button{
        width:100%
    }

    .duration-row{
        flex-direction:column
    }

    .duration-row input{
        width:100%
    }

    .key{
        align-items:flex-start;
        flex-direction:column
    }

    .key-buttons{
        width:100%
    }

    .key-buttons button{
        flex:1
    }
}
</style>
</head>

<body>

<main class="wrap">

    <!-- LOGIN -->
    <div class="card login" id="loginCard">

        <div class="logo">
            🔑 Access Key Manager
        </div>

        <p class="muted">
            Admin only. Generate one-time access keys for your visitors.
        </p>

        <div class="row">
            <input
                id="adminKey"
                type="password"
                placeholder="Admin key"
            >

            <button id="loginBtn">
                Login
            </button>
        </div>

        <div class="status" id="loginStatus"></div>

    </div>


    <!-- ADMIN PANEL -->
    <div class="card hidden" id="panel">

        <div class="head">

            <div>
                <div class="logo">
                    Access Key Manager
                </div>

                <div class="muted">
                    Create custom-duration access keys.
                </div>
            </div>

        </div>


        <!-- CUSTOM TIME -->
        <div class="duration-box">

            <div class="duration-title">
                ⏱ Access Duration
            </div>

            <div class="duration-row">

                <input
                    id="durationValue"
                    type="number"
                    min="1"
                    step="1"
                    value="1"
                    placeholder="Amount"
                >

                <select id="durationUnit">

                    <option value="minutes">
                        Minutes
                    </option>

                    <option value="hours" selected>
                        Hours
                    </option>

                    <option value="days">
                        Days
                    </option>

                    <option value="weeks">
                        Weeks
                    </option>

                </select>

            </div>

            <div class="duration-note">
                The timer starts when the user redeems the key.
                Maximum duration: 365 days.
            </div>

        </div>


        <div class="row">

            <button id="generateBtn">
                Generate Key
            </button>

        </div>


        <div class="status" id="panelStatus"></div>


        <!-- KEY LIST -->
        <div
            style="
                margin-top:25px;
                font-size:17px;
                font-weight:900;
            "
        >
            Access Keys
        </div>

        <div id="keys" style="margin-top:8px"></div>

    </div>

</main>


<script>

const loginCard =
    document.getElementById("loginCard");

const panel =
    document.getElementById("panel");

const adminKey =
    document.getElementById("adminKey");

const loginBtn =
    document.getElementById("loginBtn");

const loginStatus =
    document.getElementById("loginStatus");

const durationValue =
    document.getElementById("durationValue");

const durationUnit =
    document.getElementById("durationUnit");

const generateBtn =
    document.getElementById("generateBtn");

const panelStatus =
    document.getElementById("panelStatus");

const keysEl =
    document.getElementById("keys");


async function api(action, extra = {}) {

    const r = await fetch("/api/keys", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        credentials:"same-origin",

        body:JSON.stringify({
            action,
            ...extra
        })

    });

    const d =
        await r.json().catch(() => ({}));

    if(!r.ok){

        throw new Error(
            d.error || "Request failed"
        );

    }

    return d;
}


/* LOGIN */

loginBtn.onclick = async () => {

    loginStatus.textContent =
        "Checking...";

    try{

        await api("login",{
            key:adminKey.value.trim()
        });

        loginStatus.textContent = "";

        loginCard.classList.add("hidden");

        panel.classList.remove("hidden");

        await loadKeys();

    }catch(e){

        loginStatus.textContent =
            e.message;

        loginStatus.className =
            "status error";

    }

};


adminKey.onkeydown = e => {

    if(e.key === "Enter"){

        loginBtn.click();

    }

};


/* GENERATE CUSTOM KEY */

generateBtn.onclick = async () => {

    const value =
        Number(durationValue.value);

    const unit =
        durationUnit.value;


    if(!Number.isFinite(value) || value <= 0){

        panelStatus.textContent =
            "Enter a valid duration.";

        panelStatus.className =
            "status error";

        return;

    }


    generateBtn.disabled = true;

    panelStatus.textContent =
        "Generating...";

    panelStatus.className =
        "status";


    try{

        const d =
            await api("generate",{

                durationValue:value,

                durationUnit:unit

            });


        panelStatus.textContent =
            "Key generated: " +
            d.key +
            " — duration: " +
            formatDuration(
                d.durationValue,
                d.durationUnit
            ) +
            ". Timer starts when redeemed.";

        panelStatus.className =
            "status success";


        await loadKeys();


    }catch(e){

        panelStatus.textContent =
            e.message;

        panelStatus.className =
            "status error";

    }


    generateBtn.disabled = false;

};


/* FORMAT DURATION */

function formatDuration(value, unit){

    if(value === null || value === undefined){

        return "Legacy duration";

    }

    const number =
        Number(value);

    const names = {

        minutes:
            number === 1
            ? "minute"
            : "minutes",

        hours:
            number === 1
            ? "hour"
            : "hours",

        days:
            number === 1
            ? "day"
            : "days",

        weeks:
            number === 1
            ? "week"
            : "weeks"

    };

    return number + " " + (names[unit] || unit);

}


/* CHECK EXPIRATION */

function getStatus(k){

    if(k.status === "revoked"){

        return {
            text:"REVOKED",
            className:"revoked"
        };

    }


    if(
        k.expiresAt &&
        Date.now() >= Number(k.expiresAt)
    ){

        return {
            text:"EXPIRED",
            className:"expired"
        };

    }


    if(k.status === "used"){

        return {
            text:"USED",
            className:"used"
        };

    }


    return {
        text:"UNUSED",
        className:""
    };

}


/* LOAD KEYS */

async function loadKeys(){

    try{

        const d =
            await api("list");


        keysEl.innerHTML = "";


        if(!d.success){

            throw new Error(
                d.error ||
                "Failed to load keys."
            );

        }


        if(!d.keys || !d.keys.length){

            keysEl.innerHTML =
                '<div class="empty">' +
                'No keys generated yet.' +
                '</div>';

            return;

        }


        d.keys.forEach(k => {

            const row =
                document.createElement("div");

            row.className =
                "key";


            /* LEFT */

            const left =
                document.createElement("div");

            left.style.flex = "1";


            const code =
                document.createElement("div");

            code.className =
                "keycode";

            code.textContent =
                k.key;


            const info =
                document.createElement("div");

            info.className =
                "muted key-info";


            let durationText =
                formatDuration(
                    k.durationValue,
                    k.durationUnit
                );


            if(k.status === "unused"){

                info.textContent =
                    durationText +
                    " • Starts when redeemed";

            }else{

                info.textContent =
                    durationText;

            }


            if(k.createdAt){

                info.textContent +=
                    " • Created " +
                    new Date(
                        k.createdAt
                    ).toLocaleString();

            }


            if(k.usedAt){

                info.textContent +=
                    " • Redeemed " +
                    new Date(
                        k.usedAt
                    ).toLocaleString();

            }


            if(k.expiresAt){

                const expires =
                    new Date(
                        Number(k.expiresAt)
                    );

                info.textContent +=
                    " • Expires " +
                    expires.toLocaleString();

            }


            left.append(
                code,
                info
            );


            /* RIGHT */

            const right =
                document.createElement("div");

            right.className =
                "key-buttons";


            const status =
                getStatus(k);


            const badge =
                document.createElement("span");

            badge.className =
                "badge " +
                status.className;

            badge.textContent =
                status.text;


            /* COPY */

            const copy =
                document.createElement("button");

            copy.className =
                "secondary";

            copy.textContent =
                "Copy";


            copy.onclick = async () => {

                try{

                    await navigator.clipboard.writeText(
                        k.key
                    );

                    copy.textContent =
                        "Copied";

                    setTimeout(
                        () => {
                            copy.textContent =
                                "Copy";
                        },
                        1200
                    );

                }catch{

                    prompt(
                        "Copy this key:",
                        k.key
                    );

                }

            };


            right.append(
                badge,
                copy
            );


            /* REVOKE */

            if(
                k.status !== "revoked" &&
                k.status !== "used"
            ){

                const revoke =
                    document.createElement("button");

                revoke.className =
                    "revoke";

                revoke.textContent =
                    "Revoke";


                revoke.onclick = async () => {

                    if(
                        !confirm(
                            "Revoke this access key?"
                        )
                    ){

                        return;

                    }


                    revoke.disabled = true;

                    try{

                        await api(
                            "revoke",
                            {
                                key:k.key
                            }
                        );

                        await loadKeys();

                    }catch(e){

                        panelStatus.textContent =
                            e.message;

                        panelStatus.className =
                            "status error";

                        revoke.disabled = false;

                    }

                };


                right.append(revoke);

            }


            row.append(
                left,
                right
            );

            keysEl.append(row);

        });


    }catch(e){

        panelStatus.textContent =
            e.message;

        panelStatus.className =
            "status error";

    }

}

</script>

</body>
</html>
