<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"><title>Roblox - Access Required</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#0b0c0f;color:#f2f3f5;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:390px;max-width:100%;background:#15181e;border:1px solid #30343d;border-radius:14px;padding:30px;box-shadow:0 25px 80px rgba(0,0,0,.65);text-align:center}.logo{font-size:30px;font-weight:1000;letter-spacing:-2px;margin-bottom:24px;color:#fff}.lock{width:68px;height:68px;border-radius:50%;margin:0 auto 18px;background:#1d2027;border:1px solid #3a3f49;display:flex;align-items:center;justify-content:center;font-size:30px}h1{font-size:22px;margin-bottom:8px}.sub{font-size:13px;color:#969ba5;line-height:1.5;margin-bottom:22px}label{display:block;text-align:left;font-size:12px;color:#b5bac3;font-weight:700;margin-bottom:7px}input{width:100%;height:46px;background:#20242b;border:1px solid #3a3f49;border-radius:9px;color:#fff;padding:0 13px;outline:none;font-size:14px}input:focus{border-color:#587cff;box-shadow:0 0 0 2px rgba(61,108,255,.12)}button{width:100%;height:46px;margin-top:13px;border:0;border-radius:9px;background:#3d6cff;color:#fff;font-size:14px;font-weight:800;cursor:pointer}button:hover{background:#4d78ff}button:disabled{opacity:.6;cursor:wait}.status{min-height:20px;margin-top:12px;font-size:12px;color:#969ba5}.note{margin-top:18px;color:#5f6570;font-size:10px;line-height:1.45}
</style></head><body><div class="card"><div class="logo">ROBLOX</div><div class="lock">🔒</div><h1>Access Required</h1><p class="sub">Enter your one-time access key to continue.</p><form id="accessForm"><label for="accessKey">Access Key</label><input id="accessKey" type="password" autocomplete="off" placeholder="RBX-XXXX-XXXX-XXXX-XXXX" required><button id="unlockButton" type="submit">Unlock Website</button></form><div class="status" id="status" aria-live="polite"></div><div class="note">Each access key can be redeemed only once.</div></div>
<script>
const form=document.getElementById('accessForm'),input=document.getElementById('accessKey'),button=document.getElementById('unlockButton'),status=document.getElementById('status');
form.addEventListener('submit',async e=>{e.preventDefault();const key=input.value.trim();if(!key){status.textContent='Please enter your access key.';return}button.disabled=true;button.textContent='Checking...';status.textContent='';try{const r=await fetch('/api/access',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({key})});const d=await r.json().catch(()=>({}));if(r.ok&&d.success){status.textContent='Access granted. Opening website...';window.location.replace('/');return}status.textContent=d.error||'Invalid or already-used access key.'}catch(err){status.textContent='Could not connect to the access server. Try again.'}button.disabled=false;button.textContent='Unlock Website';});input.focus();
</script></body></html>
